<!DOCTYPE html>
<html>
  <head>
    <title>keylog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>

      button {
        border: none;
        cursor: pointer;
      }   
      
      body {
        background-color: rgba(0, 0, 0, 0.842);
        font-family: 'Roboto', sans-serif;
      }

      .home-btn {
        height: 50px;
        width: 55px;
        cursor: pointer;
        background-color: rgb(215, 131, 145);
        border-radius: 10px;
        transition: 0.5s;
        border-color: black;
      }

      .home-btn img{
        width: 100%;
        height: 100%;
      }

      .home-btn:hover {
        background-color: rgb(230, 63, 91);
        box-shadow: 4px 4px 12px rgba(2,2,0,0.2);
      }

      .pieces-text {
        font-size: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        margin-top: 0px;

      }



    </style>

  </head>
  <body>
    <a href="index.html">
      <button class="home-btn">
        <img src="home.png" alt="Home">      
      </button>
    </a>
   
    <div>
      <p class="pieces-text">
        These are your practice pieces
      </p>
    </div>

    <div class="repo-grid">



    </div>
  </body>
</html>
